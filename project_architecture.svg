<svg width="100%" viewBox="0 0 1180 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Pulse Architecture</title>
  <desc id="desc">Architecture diagram for Cloud Pulse Dashboard showing agents, SQS, Lambda scheduler, DynamoDB, dashboard live polling, and two compute servers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3dd68c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <style>
      .bg { fill: #08111f; }
      .title { fill: #f8fafc; font: 700 30px Segoe UI, Arial, sans-serif; }
      .subtitle { fill: #8ea7c2; font: 400 14px Segoe UI, Arial, sans-serif; }
      .zone { fill: #111c2e; stroke: #29415f; stroke-width: 1.5; }
      .zone-agent { fill: #171737; stroke: #6d5dfc; }
      .zone-scheduler { fill: #0e2a26; stroke: #31c48d; }
      .zone-server { fill: #23170e; stroke: #fb923c; }
      .zone-dashboard { fill: #0d2240; stroke: #60a5fa; }
      .box { fill: #172338; stroke: #344963; stroke-width: 1.2; }
      .box-agent { fill: #211b4f; stroke: #8b7cf6; }
      .box-scheduler { fill: #0f3a32; stroke: #3dd68c; }
      .box-server { fill: #2d1c0f; stroke: #fb923c; }
      .box-idle { fill: #1f2937; stroke: #94a3b8; }
      .box-dashboard { fill: #0f315c; stroke: #60a5fa; }
      .label { fill: #eef6ff; font: 700 15px Segoe UI, Arial, sans-serif; }
      .small { fill: #a9bdd3; font: 400 12px Segoe UI, Arial, sans-serif; }
      .tiny { fill: #8ea7c2; font: 400 11px Segoe UI, Arial, sans-serif; }
      .mono { fill: #b6c7db; font: 400 11px Consolas, monospace; }
      .green { fill: #86efac; }
      .blue { fill: #93c5fd; }
      .orange { fill: #fdba74; }
      .muted { fill: #94a3b8; }
      .line { fill: none; stroke: #9fb3c8; stroke-width: 1.6; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #3dd68c; stroke-width: 1.8; marker-end: url(#arrow-green); }
      .line-blue { fill: none; stroke: #60a5fa; stroke-width: 1.8; marker-end: url(#arrow-blue); }
      .line-orange { fill: none; stroke: #fb923c; stroke-width: 1.8; marker-end: url(#arrow-orange); }
      .dash { stroke-dasharray: 6 5; }
      .chip { fill: #223148; stroke: #40546f; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="780"/>

  <text class="title" x="40" y="50">Cloud Pulse Dashboard</text>
  <text class="subtitle" x="40" y="74">Agent-based CPU bidding, Lambda scheduling, live dashboard telemetry, and dynamic reallocation</text>

  <!-- Agent and dashboard EC2 -->
  <rect class="zone zone-agent" x="40" y="110" width="300" height="520" rx="18"/>
  <text class="label" x="64" y="142">Agent / Dashboard EC2</text>
  <text class="mono" x="64" y="162">98.89.93.192:8080</text>

  <rect class="box box-agent" x="65" y="190" width="250" height="54" rx="10"/>
  <text class="label" x="190" y="213" text-anchor="middle">4 App Agents</text>
  <text class="small" x="190" y="232" text-anchor="middle">payment, recommendation, weather, notification</text>

  <rect class="box box-agent" x="65" y="264" width="250" height="62" rx="10"/>
  <text class="label" x="190" y="288" text-anchor="middle">agent.py</text>
  <text class="small" x="190" y="307" text-anchor="middle">polls /load, sends bids every 10s</text>

  <rect class="box box-agent" x="65" y="346" width="250" height="62" rx="10"/>
  <text class="label" x="190" y="370" text-anchor="middle">Groq LLM</text>
  <text class="small" x="190" y="389" text-anchor="middle">short reasoning text only</text>

  <rect class="box box-dashboard" x="65" y="438" width="250" height="118" rx="12"/>
  <text class="label" x="190" y="464" text-anchor="middle">Cloud Pulse Dashboard</text>
  <text class="small" x="190" y="486" text-anchor="middle">dashboard_api.py + dashboard.html</text>
  <text class="small" x="190" y="508" text-anchor="middle">shows allocated CPU + live CPU sum</text>
  <text class="small" x="190" y="530" text-anchor="middle">fast-trigger on idle spikes / downshift</text>

  <rect class="chip" x="65" y="580" width="250" height="28" rx="14"/>
  <text class="tiny" x="190" y="599" text-anchor="middle">start with ~/start_agents.sh</text>

  <!-- Scheduler services -->
  <rect class="zone zone-scheduler" x="420" y="110" width="330" height="520" rx="18"/>
  <text class="label" x="444" y="142">AWS Scheduler Layer</text>
  <text class="small" x="444" y="162">SQS + Lambda + DynamoDB + EventBridge</text>

  <rect class="box box-scheduler" x="470" y="190" width="230" height="62" rx="12"/>
  <text class="label" x="585" y="215" text-anchor="middle">SQS bids-queue</text>
  <text class="small" x="585" y="235" text-anchor="middle">agent bids wait here</text>

  <rect class="box box-scheduler" x="470" y="294" width="230" height="96" rx="12"/>
  <text class="label" x="585" y="320" text-anchor="middle">Lambda scheduler</text>
  <text class="small" x="585" y="342" text-anchor="middle">score bids + bin pack</text>
  <text class="small" x="585" y="362" text-anchor="middle">BID_HIGH / BID_SPLIT / DEFERRED / IDLE</text>

  <rect class="box box-scheduler" x="470" y="432" width="230" height="68" rx="12"/>
  <text class="label" x="585" y="458" text-anchor="middle">DynamoDB allocations</text>
  <text class="small" x="585" y="480" text-anchor="middle">latest cycle + server_load + idle</text>

  <rect class="box box-scheduler" x="470" y="536" width="230" height="62" rx="12"/>
  <text class="label" x="585" y="561" text-anchor="middle">EventBridge</text>
  <text class="small" x="585" y="581" text-anchor="middle">regular scheduler cycles</text>

  <!-- Compute servers -->
  <rect class="zone zone-server" x="830" y="110" width="310" height="520" rx="18"/>
  <text class="label" x="854" y="142">Compute EC2 Servers</text>
  <text class="small" x="854" y="162">Lambda starts/stops apps through SSM</text>

  <rect class="box box-server" x="860" y="190" width="250" height="160" rx="14"/>
  <text class="label" x="985" y="216" text-anchor="middle">Server 1</text>
  <text class="mono" x="985" y="236" text-anchor="middle">44.219.23.100 | 100 CPU</text>
  <rect class="chip" x="884" y="260" width="202" height="26" rx="8"/>
  <text class="small" x="985" y="278" text-anchor="middle">recommendation-app</text>
  <rect class="chip" x="884" y="296" width="202" height="26" rx="8"/>
  <text class="small" x="985" y="314" text-anchor="middle">allocated / squeezed / idle</text>

  <rect class="box box-server" x="860" y="390" width="250" height="170" rx="14"/>
  <text class="label" x="985" y="416" text-anchor="middle">Server 2</text>
  <text class="mono" x="985" y="436" text-anchor="middle">54.209.233.61 | 100 CPU</text>
  <rect class="chip" x="884" y="460" width="202" height="26" rx="8"/>
  <text class="small" x="985" y="478" text-anchor="middle">payment-app</text>
  <rect class="chip" x="884" y="496" width="202" height="26" rx="8"/>
  <text class="small" x="985" y="514" text-anchor="middle">weather / notification</text>
  <text class="tiny" x="985" y="542" text-anchor="middle">stopped by process path + app port</text>

  <!-- Main data flow arrows -->
  <path class="line-green" d="M 315 220 C 370 220 405 220 468 220"/>
  <text class="tiny green" x="390" y="207" text-anchor="middle">bids</text>

  <path class="line-green" d="M 585 252 L 585 292"/>
  <text class="tiny green" x="603" y="276">drain</text>

  <path class="line-green" d="M 585 390 L 585 430"/>
  <text class="tiny green" x="603" y="414">write result</text>

  <path class="line-green" d="M 585 536 L 585 392"/>
  <text class="tiny green" x="612" y="528">invoke</text>

  <path class="line-orange" d="M 700 342 C 765 342 790 342 858 285"/>
  <text class="tiny orange" x="778" y="316" text-anchor="middle">SSM start/stop</text>

  <path class="line-orange" d="M 700 354 C 770 390 800 435 858 475"/>
  <text class="tiny orange" x="778" y="430" text-anchor="middle">SSM start/stop</text>

  <path class="line-blue" d="M 470 466 C 410 466 370 486 317 494"/>
  <text class="tiny blue" x="398" y="452" text-anchor="middle">read state</text>

  <path class="line-blue dash" d="M 315 496 C 382 535 420 566 468 566"/>
  <text class="tiny blue" x="390" y="548" text-anchor="middle">fast trigger</text>

  <path class="line-blue dash" d="M 315 520 C 500 690 760 650 860 540"/>
  <text class="tiny blue" x="600" y="668" text-anchor="middle">dashboard polls /load for live CPU</text>

  <path class="line dash" d="M 315 295 C 500 120 720 120 860 230"/>
  <text class="tiny muted" x="590" y="108" text-anchor="middle">agents poll /load endpoints</text>

  <path class="line" d="M 190 326 L 190 344"/>
  <text class="tiny orange" x="214" y="339">reasoning</text>

  <!-- Rules panel -->
  <rect class="zone" x="40" y="665" width="1100" height="72" rx="16"/>
  <text class="label" x="64" y="695">Scheduling rules</text>
  <text class="small" x="64" y="719">Score = load + urgency + wait time + deferred count</text>
  <text class="small" x="360" y="719">Max allocation per app: 70 CPU</text>
  <text class="small" x="620" y="719">Split only if gap &lt;= 30 CPU</text>
  <text class="small" x="850" y="719">Dashboard reconciles live vs allocated CPU</text>

  <!-- Legend -->
  <rect x="40" y="750" width="12" height="12" rx="2" fill="#6d5dfc"/>
  <text class="tiny" x="60" y="761">Agent/dashboard EC2</text>
  <rect x="210" y="750" width="12" height="12" rx="2" fill="#31c48d"/>
  <text class="tiny" x="230" y="761">Scheduler services</text>
  <rect x="370" y="750" width="12" height="12" rx="2" fill="#fb923c"/>
  <text class="tiny" x="390" y="761">Compute servers</text>
  <rect x="520" y="750" width="12" height="12" rx="2" fill="#60a5fa"/>
  <text class="tiny" x="540" y="761">Live dashboard feedback</text>
</svg>
